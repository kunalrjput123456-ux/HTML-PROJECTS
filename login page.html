<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    
</head>
<style> .social { display: flex; justify-content: center; gap: 20px; margin-top: 20px; } .social a { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 28px; font-weight: bold; } .facebook { background-color: #1877F2; color: white; } .google { background-color: white; color: #4285F4; border: 1px solid #ddd; } </style>
<body>
    <div class="login-container">
        <h1>Login</h1>
        >
            <label for="username">Username:</label>
            <input type="text" placeholder="Enter your username" >

            <label for="password">Password:</label>
            <input type="password" placeholder="Enter your password" >
            <p class="forgot-password"><a href="forgot-password.html">Forgot Password?</a></p>

            <button type="submit">Login</button>

            <p class="signup-link">Don't have an account? <a href="signup.html"> Sign up</a></p>
            <p class="using">Using</p>
    
    <div class="social ">
    <a href="#" class="social-btn Facebook">f</a>
    <a href="#" class="social-btn Google">G</a>
    </div>
    
        
</body>
</html>
