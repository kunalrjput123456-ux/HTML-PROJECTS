```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8faff;
        }

        .login-box {
            width: 430px;
            padding: 35px;
            text-align: center;
        }

        /* Heading */

        h1 {
            font-size: 42px;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 18px;
            margin-bottom: 35px;
        }

        /* Input Box */

        .input-box {
            width: 100%;
            height: 65px;
            border: 2px solid #d8e0ed;
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            margin-bottom: 18px;
            background: white;
        }

        .input-box i {
            font-size: 24px;
            color: #64748b;
            margin-right: 15px;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 17px;
            color: #333;
        }

        .input-box input::placeholder {
            color: #7b8ba5;
        }

        .eye {
            cursor: pointer;
            margin-left: 10px;
        }

        /* Login Button */

        .login-btn {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 15px;
            background: #3478f6;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #2563eb;
        }

        /* Divider */

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 35px 0 25px;
            color: #64748b;
            font-size: 17px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 2px;
            background: #d8e0ed;
            flex: 1;
        }

        /* Social Buttons */

        .social {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social a {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 30px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* Facebook */

        .facebook {
            background: #1877f2;
            color: white;
        }

        .facebook:hover {
            transform: translateY(-3px);
        }

        /* Google */

        .google {
            background: white;
            color: #4285f4;
            border: 1px solid #e5e7eb;
        }

        .google:hover {
            transform: translateY(-3px);
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your account
        </p>


        <!-- Email -->

        <div class="input-box">

            <i class="fa-regular fa-envelope"></i>

            <input
                type="email"
                placeholder="Email address">

        </div>


        <!-- Password -->

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                placeholder="Password">

            <i class="fa-regular fa-eye eye"></i>

        </div>


        <!-- Login Button -->

        <button class="login-btn">
            Login
        </button>


        <!-- Divider -->

        <div class="divider">
            Or continue with
        </div>


        <!-- Facebook & Google -->

        <div class="social">

            <a href="#" class="facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="#" class="google">
                <i class="fa-brands fa-google"></i>
            </a>

        </div>

    </div>

</body>
</html>
```
