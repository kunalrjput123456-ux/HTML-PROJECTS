<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #01b09c, #9a35d9);
        color: white;
    }
</style>

<body>
    

    <h1 class="heading1">Hello,World!</h1>
    <style> 
    .heading1{
       font-family:cursive;
       text-align: center;
       color: rgb(228, 134, 216);
       font-style: oblique;
    }
    </style> 
   
    <h2 class="heading2">Welcome to my website</h2>
    <style>
        .heading2 {
          
            font-family: serif;
            position: absolute;
            top: 8%;
            left: 43%;
           transform: translateY(-50%);           
            color: rgb(255, 178, 178);
            font-style: oblique;
        }
    </style>
    <p class="paragraph">This is a paragraph of text that provides some information about the website.
        <br> It is styled with a specific font and color to make it visually appealing.</p>
    <style>
        .paragraph {
            font-family:cursive;
            color: rgb(227, 197, 160);
            font-size: 16px;
            line-height: 20px;
            text-align: block;
        }
        .paragraph {
        animation: slideIn 2s ease-in-out;
        }
            @keyframes slideIn {
                 from {
                    transform: translateY(-100%);
                 
                }
                to {
                    transform: translateY(0);
                   
                }
            }
        </style>

        <div class="login-box">
            <h3>Login</h3>
            <form>
                <input type="text" placeholder="Username" />
                <input type="password" placeholder="Password" />
                <button type="submit">Submit</button>
            </form>
        </div>
        <style>
            .login-box {
               
                width: 300px;
                padding: 40px;
                margin: 50px auto;
                background: #d517a5;
                color: white;
                border-radius: 30px;
                box-shadow: 0 10px 30px rgba(255, 158, 158, 0.4);
            }
            .login-box h3 {
                text-align: center;
                
                margin-top: -10px;
            }
            .login-box input {
                width: 95%;
                padding: 10px;
                margin-bottom: 10px;
                border-radius: 5px;
                border: none;
            }
            .login-box button {
                  right: 5%;
                  transform: translateX(3%);  
                width:95%;
                padding: 9px;
                background-color: #101010;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
        </style>
      
       
</body>
</html>
