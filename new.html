<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #141e30, #243b55);
        color: white;
    }
</style>

<body>
    

    <h1 class="heading1">Hello,World!</h1>
    <style> 
    .heading1{
       font-family:cursive;
       text-align: center;
       color: rgb(228, 134, 216);
       font-style: oblique;
    }
    </style> 
   
    <h2 class="heading2">Welcome to my website</h2>
    <style>
        .heading2 {
          
            font-family: serif;
            position: absolute;
            top: 8%;
            left: 43%;
           transform: translateY(-50%);           
            color: rgb(255, 178, 178);
            font-style: oblique;
        }
    </style>
    <p class="paragraph">This is a paragraph of text that provides some information about the website.
        <br> It is styled with a specific font and color to make it visually appealing.</p>
    <style>
        .paragraph {
            font-family:cursive;
            color: rgb(227, 197, 160);
            font-size: 16px;
            line-height: 20px;
            text-align: block;
        }
        .paragraph {
        animation: slideIn 2s ease-in-out;
        }
            @keyframes slideIn {
                 from {
                    transform: translateY(-100%);
                 
                }
                to {
                    transform: translateY(0);
                   
                }
            }

        </style>
</body>
</html>
